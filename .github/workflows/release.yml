name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # needed for release PR creation
  pull-requests: write # needed for version PR creation (changesets/action v2)
  id-token: write # needed for provenance and publishing to npm

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      # Enable turbo remote caching. The release workflow holds id-token:write
      # (OIDC npm publishing), so it is write-only: it never restores a cache
      # that a lower-trust run could have poisoned, but still populates it.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:w

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npm run version
          publish-script: npm run release
          github-token: ${{ secrets.GH_TOKEN_CHANGESETS }}
        env:
          NPM_CONFIG_PROVENANCE: true
